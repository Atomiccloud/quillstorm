<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Quillstorm — A Porcupine Roguelike. Shoot quills, survive waves, climb the leaderboard." />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>Quillstorm — A Porcupine Roguelike</title>
  <style>
    :root {
      --bg-deep: #12121f;
      --bg: #1a1a2e;
      --bg-raised: #222240;
      --gold: #e8d5a3;
      --gold-dim: #b8a67a;
      --gold-glow: rgba(232, 213, 163, 0.15);
      --green: #6a8a5a;
      --green-bright: #7fa06a;
      --green-glow: rgba(106, 138, 90, 0.25);
      --border: #4a4a6a;
      --border-dim: #3a3a54;
      --text: #ccc;
      --text-dim: #888;
      --text-faint: #555;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Atmospheric layered background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 20%, rgba(106, 138, 90, 0.06) 0%, transparent 70%),
        radial-gradient(ellipse 60% 80% at 20% 80%, rgba(74, 74, 106, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 80% 70%, rgba(232, 213, 163, 0.04) 0%, transparent 50%),
        linear-gradient(180deg, var(--bg-deep) 0%, var(--bg) 30%, var(--bg) 70%, var(--bg-deep) 100%);
      pointer-events: none;
      z-index: 0;
    }

    /* Subtle grain texture */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-repeat: repeat;
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1.5rem 2rem;
      min-height: 100vh;
    }

    /* ─── HERO ─── */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 3rem;
      animation: fadeUp 0.8s ease-out both;
    }

    .title {
      font-size: clamp(2.8rem, 8vw, 4.5rem);
      font-weight: 800;
      color: var(--gold);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-shadow:
        0 0 40px rgba(232, 213, 163, 0.2),
        0 2px 0 rgba(0, 0, 0, 0.4);
      line-height: 1.1;
      margin-bottom: 0.25rem;
    }

    .subtitle {
      font-size: clamp(0.95rem, 2.5vw, 1.15rem);
      color: var(--text-dim);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      font-weight: 400;
      margin-bottom: 2rem;
    }

    .mascot {
      width: clamp(180px, 30vw, 260px);
      height: auto;
      filter: drop-shadow(0 8px 32px rgba(0, 0, 0, 0.5));
      margin-bottom: 2.5rem;
      animation: float 6s ease-in-out infinite;
    }

    .play-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 1rem 3rem;
      background: var(--green);
      color: #fff;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 6px;
      border: 2px solid var(--green-bright);
      box-shadow:
        0 4px 20px var(--green-glow),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transition: all 0.2s ease;
    }

    .play-btn:hover {
      background: var(--green-bright);
      box-shadow:
        0 6px 30px rgba(106, 138, 90, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
      transform: translateY(-1px);
    }

    .play-btn:active {
      transform: translateY(1px);
      box-shadow: 0 2px 10px var(--green-glow);
    }

    .play-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* ─── DIVIDER ─── */
    .divider {
      width: 100%;
      max-width: 600px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border-dim) 30%, var(--border) 50%, var(--border-dim) 70%, transparent);
      margin: 2.5rem 0;
    }

    /* ─── DOWNLOADS ─── */
    .downloads {
      text-align: center;
      animation: fadeUp 0.8s ease-out 0.15s both;
    }

    .section-title {
      font-size: 1.1rem;
      color: var(--gold-dim);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 1.25rem;
    }

    .platform-grid {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .platform-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
      padding: 1rem 1.8rem;
      background: transparent;
      color: var(--text);
      text-decoration: none;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      transition: all 0.2s ease;
      min-width: 150px;
    }

    .platform-btn:hover {
      border-color: var(--gold-dim);
      color: var(--gold);
      background: var(--gold-glow);
      transform: translateY(-1px);
    }

    .platform-btn:active {
      transform: translateY(1px);
    }

    .platform-icon {
      font-size: 1.6rem;
      line-height: 1;
    }

    .platform-note {
      display: block;
      font-size: 0.72rem;
      color: var(--text-faint);
      font-weight: 400;
      margin-top: 0.8rem;
      max-width: 320px;
      line-height: 1.4;
    }

    /* ─── LINKS ─── */
    .links {
      display: flex;
      gap: 2rem;
      margin-top: 0.5rem;
      animation: fadeUp 0.8s ease-out 0.3s both;
    }

    .link {
      color: var(--text-dim);
      text-decoration: none;
      font-size: 0.9rem;
      letter-spacing: 0.06em;
      padding: 0.4rem 0;
      border-bottom: 1px solid transparent;
      transition: all 0.2s ease;
    }

    .link:hover {
      color: var(--gold);
      border-bottom-color: var(--gold-dim);
    }

    /* ─── FOOTER ─── */
    .footer {
      margin-top: auto;
      padding-top: 3rem;
      font-size: 0.78rem;
      color: var(--text-faint);
      letter-spacing: 0.08em;
      animation: fadeUp 0.8s ease-out 0.4s both;
    }

    /* ─── ANIMATIONS ─── */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    /* ─── MOBILE ─── */
    @media (max-width: 560px) {
      .page {
        padding: 2rem 1.25rem 1.5rem;
      }

      .platform-grid {
        flex-direction: column;
        align-items: center;
      }

      .platform-btn {
        width: 100%;
        max-width: 260px;
        flex-direction: row;
        justify-content: center;
      }

      .links {
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <section class="hero">
      <h1 class="title">Quillstorm</h1>
      <p class="subtitle">A Porcupine Roguelike</p>
      <img class="mascot" src="assets/mascot.png" alt="Quillstorm — a heroic porcupine" width="260" height="260" />
      <a href="/play" class="play-btn">
        <svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
        Play in Browser
      </a>
    </section>

    <div class="divider"></div>

    <section class="downloads">
      <h2 class="section-title">Download Desktop App</h2>
      <div class="platform-grid">
        <a href="https://github.com/Atomiccloud/quillstorm/releases/latest/download/Quillstorm-Setup.exe" class="platform-btn">
          <span class="platform-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M3 12V6.75l8-1.25V12H3zm0 .5h8v6.5L3 17.75V12.5zM11.5 12V5.35l9.5-1.6V12H11.5zm0 .5H21v7.75l-9.5 1.4V12.5z"/></svg>
          </span>
          Windows
        </a>
        <a href="https://github.com/Atomiccloud/quillstorm/releases/latest/download/Quillstorm.dmg" class="platform-btn">
          <span class="platform-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
          </span>
          macOS
        </a>
        <a href="https://github.com/Atomiccloud/quillstorm/releases/latest/download/Quillstorm.AppImage" class="platform-btn">
          <span class="platform-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20.581 19.049l-7.581-12.682v-2.367h1c.553 0 1-.448 1-1s-.447-1-1-1h-4c-.553 0-1 .448-1 1s.447 1 1 1h1v2.367l-7.581 12.682c-.354.591.086 1.328.764 1.328h15.634c.678 0 1.118-.737.764-1.328zm-12.622-.426l4.041-6.748 4.041 6.748h-8.082z"/></svg>
          </span>
          Linux
        </a>
      </div>
      <span class="platform-note">macOS users: you may need to right-click &rarr; Open on first launch (unsigned app)</span>
    </section>

    <div class="divider"></div>

    <nav class="links">
      <a href="/upgrade-reference" class="link">Upgrade Reference</a>
      <a href="/changelog" class="link">Changelog</a>
    </nav>

    <footer class="footer">&copy; 2026 Quillstorm</footer>
  </div>
</body>
</html>
