appId: com.quillstorm.app
productName: Quillstorm
copyright: Copyright © 2026 Quillstorm

directories:
  buildResources: build
  output: electron-dist

files:
  - electron/**/*
  - package.json

win:
  target: nsis
  icon: build/icon.png
  artifactName: Quillstorm-Setup.${ext}

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false

mac:
  target: dmg
  icon: build/icon.png
  category: public.app-category.games
  artifactName: Quillstorm.${ext}

dmg:
  title: Quillstorm

linux:
  target: AppImage
  icon: build/icon.png
  category: Game
  artifactName: Quillstorm.${ext}

publish:
  provider: github
  owner: Atomiccloud
  repo: quillstorm
