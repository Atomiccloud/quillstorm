<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <title>Quillstorm</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        height: 100%;
        overflow: hidden;
      }
      body {
        background-color: #1a1a2e;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      #game-container {
        border: 3px solid #4a4a6a;
        border-radius: 8px;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        /* Container dimensions - Phaser scales within these bounds */
        width: min(1440px, 95vw);
        height: min(810px, 95vh);
        /* Maintain aspect ratio when constrained */
        aspect-ratio: 16 / 9;
        touch-action: none;
      }

      /* Mobile: full-bleed, no border */
      @media (max-width: 1024px) and (hover: none) and (pointer: coarse) {
        #game-container {
          width: 100vw;
          height: 100vh;
          border: none;
          border-radius: 0;
          box-shadow: none;
        }
      }

      /* Portrait orientation warning */
      #portrait-warning {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: #1a1a2e;
        color: #ccc;
        z-index: 9999;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-family: sans-serif;
        text-align: center;
        padding: 2rem;
      }
      #portrait-warning .rotate-icon {
        font-size: 4rem;
        margin-bottom: 1rem;
        animation: rotate-hint 2s ease-in-out infinite;
      }
      #portrait-warning p {
        font-size: 1.2rem;
        max-width: 280px;
      }
      @keyframes rotate-hint {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(90deg); }
      }
      @media (orientation: portrait) and (hover: none) and (pointer: coarse) {
        #portrait-warning { display: flex; }
        #game-container { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="portrait-warning">
      <div class="rotate-icon">📱</div>
      <p>Please rotate your device to landscape mode to play Quillstorm</p>
    </div>
    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      }
    </script>
  </body>
</html>
